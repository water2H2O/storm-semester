<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Storm Semester · 学期风暴</title>
<meta name="description" content="把一学期的截止日期变成天气。你的学期也有天气预报。">
<link rel="stylesheet" href="styles.css">
</head>
<body data-weather="storm" data-mode="city">

  <!-- 城市层：始终铺满 -->
  <div class="sky" aria-hidden="true">
    <div class="sky-layer sky-a"></div>
    <div class="sky-layer sky-b"></div>
  </div>
  <canvas id="sky3d" aria-hidden="true"></canvas>
  <div class="rain" id="rain" aria-hidden="true"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <!-- 气泡层：贴在 3D 锚点上，点一下跳进面板 -->
  <div class="bubbles" id="bubbles"></div>

  <!-- 电视台角标：恶劣天气时左上角挂警告信号 -->
  <div class="tx-badge" id="txBadge" aria-live="polite"></div>

  <!-- 城市态：浮在城市上方的极简信息条 -->
  <div class="city-hud" id="cityHud">
    <div class="city-hud-top">
      <div class="brand">
        <span class="dot"></span>
        Storm Semester
      </div>
      <div class="city-switch" id="citySwitchHud" role="group" aria-label="选择城市"></div>
    </div>

    <div class="city-hud-main">
      <div class="city-weather">
        <span class="city-icon" id="cityIcon">⛈️</span>
        <span class="city-title" id="cityTitle">雷暴</span>
      </div>
      <div class="city-sub" id="citySub">今天有 0 个事项到期</div>
      <div class="city-next" id="cityNext">下一场风暴：黑色暴雨 · 周五 11/13 · 还有 4 天</div>
    </div>

    <button class="city-enter" id="cityEnter" type="button">
      查看学期详情
      <span class="city-enter-arrow">↑</span>
    </button>
  </div>

  <!-- 数据态：完整界面，向上滑入 -->
  <main class="wrap" id="appMain">
    <div class="wrap-drag" aria-hidden="true"></div>

    <header class="top">
      <div class="brand">
        <span class="dot"></span>
        Storm Semester
      </div>
      <div class="top-actions">
        <div class="city-switch" id="citySwitch" role="group" aria-label="选择城市"></div>
        <button class="theme-tag city-back" id="cityBack" type="button">← 回到城市</button>
      </div>
    </header>

    <section class="hero" id="sectionToday">
      <div class="hero-icon" id="heroIcon">⛈️</div>
      <h1 class="hero-title" id="heroTitle">雷暴</h1>
      <p class="hero-sub" id="heroSub">今天有 0 个事项到期</p>
      <div class="hero-meta">
        <span class="pill" id="heroDate">2026-11-13 周五</span>
        <span class="pill" id="heroScore">压力 9.4</span>
      </div>
    </section>

    <section class="next" id="nextSection">
      <div class="next-inner">
        <div class="next-icon" id="nextIcon">🌑</div>
        <div class="next-body">
          <div class="next-label">下一场风暴</div>
          <div class="next-title" id="nextTitle">黑色暴雨 · 周五 11/13</div>
          <div class="next-sub" id="nextSub">5 个事项 · 还有 4 天</div>
        </div>
        <div class="next-badge" id="nextBadge">T8</div>
      </div>
    </section>

    <section class="focus" id="sectionFocus">
      <div class="section-label">现在做这一件</div>
      <article class="focus-card" id="focusCard"></article>
    </section>

    <section class="week">
      <div class="section-label">本周</div>
      <div class="week-strip" id="weekStrip"></div>
    </section>

    <section class="timeline">
      <div class="section-label">未来三周</div>
      <div class="timeline-scroll" id="timeline"></div>
      <div class="timeline-hint">越远越模糊 —— 远期预报本来就不准</div>
    </section>

    <section class="activities" id="sectionActivities">
      <div class="section-label">最近的活动</div>
      <div class="activity-list" id="activityList"></div>
      <button class="btn add-btn" id="addActivityBtn" type="button">+ 新增活动</button>

      <form class="event-form" id="activityForm" hidden>
        <label class="field">
          <span>活动名称</span>
          <input name="title" type="text" required maxlength="40" placeholder="例如 CCL 讲座" autocomplete="off">
        </label>
        <label class="field">
          <span>日期</span>
          <input name="date" type="date" required>
        </label>
        <label class="field">
          <span>时间（可选）</span>
          <input name="time" type="time">
        </label>
        <label class="field">
          <span>地点（可选）</span>
          <input name="place" type="text" maxlength="40" placeholder="例如 AAB 学术大楼" autocomplete="off">
        </label>
        <div class="form-actions">
          <button class="btn primary" type="submit">加入活动</button>
          <button class="btn" type="button" id="cancelActivity">取消</button>
        </div>
      </form>
    </section>

    <section class="manage" id="sectionManage">
      <div class="section-label">事项管理</div>
      <div class="event-list" id="eventList"></div>

      <div class="manage-actions">
        <button class="btn add-btn" id="addEventBtn" type="button">+ 新增事项</button>
        <button class="btn add-btn" id="importBtn" type="button">导入日历 .ics</button>
        <input type="file" id="importFile" accept=".ics,text/calendar" hidden>
      </div>

      <div class="import-preview" id="importPreview" hidden></div>

      <form class="event-form" id="eventForm" hidden>
        <label class="field">
          <span>名称</span>
          <input name="title" type="text" required maxlength="40" placeholder="例如 小组项目提交" autocomplete="off">
        </label>
        <label class="field">
          <span>类型</span>
          <select name="type" id="eventType"></select>
        </label>
        <label class="field">
          <span>截止 / 发生时间</span>
          <input name="due" type="datetime-local" required>
        </label>
        <label class="field">
          <span>压力权重 <output id="weightOut">3</output></span>
          <input name="weight" type="range" min="1" max="6" step="0.5" value="3">
        </label>
        <label class="field">
          <span>准备窗口 <output id="leadOut">7</output> 天</span>
          <input name="leadDays" type="range" min="1" max="21" step="1" value="7">
        </label>
        <div class="form-actions">
          <button class="btn primary" type="submit">加入学期</button>
          <button class="btn" type="button" id="cancelAdd">取消</button>
        </div>
      </form>
    </section>

    <footer class="foot">
      <span>天气不归你管，伞归你管。</span>
      <span class="foot-dim">BUHACK 2.0 · HKBU Coding Club</span>
    </footer>
  </main>

  <script src="three.min.js"></script>
  <script>
    /* 城市注册表：cities/*.js 在 scene3d.js 之前把自己登记进来 */
    window.STORM_CITIES = { list: [], register: function (c) { this.list.push(c); return c.id; } };
  </script>
  <script src="cities/generic.js"></script>
  <script src="cities/hongkong.js"></script>
  <script src="scene3d.js"></script>
  <script src="engine.js"></script>
  <script src="store.js"></script>
  <script src="importer.js"></script>
  <script src="app.js"></script>
</body>
</html>
